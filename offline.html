<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE BREAK - Offline</title>
  <style>
    body {
      background: #050505;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 500px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      color: #00F5FF;
      text-shadow: 0 0 20px rgba(0,245,255,0.3);
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
    }
    .icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: #00F5FF;
      color: #050505;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn:hover {
      background: #00D4E0;
      box-shadow: 0 0 20px rgba(0,245,255,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">⚡</span>
    <h1>PULSE BREAK</h1>
    <p>Você está offline no momento.</p>
    <p>Conecte-se à internet para utilizar todas as funcionalidades.</p>
    <a href="/" class="btn">Tentar novamente</a>
  </div>
</body>
</html>
